services:
  - type: web
    name: fdr-sentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DB_NAME
        value: fdr_sentinel
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: DOC_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
